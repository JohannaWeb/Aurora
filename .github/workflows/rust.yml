name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# A newer push to the same branch or PR makes the older run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    # Pinned rather than ubuntu-latest: visual snapshots depend on fontconfig
    # and the installed fonts, which must match the machine the baselines were
    # rendered on (Ubuntu 24.04 / fontconfig 2.15).
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Aurora
      uses: actions/checkout@v4

    - name: Install Linux dependencies and fonts
      # fonts-noto-core provides `sans-serif` (Noto Sans), fonts-liberation the
      # `Arial` substitute and fonts-dejavu-core `monospace`, as on the dev
      # machine the snapshots were rendered on.
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libfontconfig1-dev \
          libwayland-dev \
          libx11-dev \
          libx11-xcb-dev \
          libxcb1-dev \
          libxcb-render0-dev \
          libxcb-shape0-dev \
          libxcb-xfixes0-dev \
          libxkbcommon-dev \
          pkg-config \
          fonts-noto-core \
          fonts-liberation \
          fonts-dejavu-core
        fc-match sans-serif
        fc-match Arial
        fc-match monospace

    # Caches ~/.cargo and target/, which also holds the prebuilt V8 archive the
    # v8 crate downloads at build time.
    - name: Cache cargo build
      uses: Swatinem/rust-cache@v2

    - name: Build
      run: cargo build --locked

    - name: Run unit tests
      run: cargo test --locked --lib --bins

    - name: Run visual regression tests
      run: cargo test --locked --test visual_regression

    - name: Upload visual diffs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: visual-diffs
        path: tests/screenshots/*-diff.png
        if-no-files-found: ignore

  clippy:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Aurora
      uses: actions/checkout@v4

    - name: Install Linux dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libfontconfig1-dev \
          libwayland-dev \
          libx11-dev \
          libx11-xcb-dev \
          libxcb1-dev \
          libxcb-render0-dev \
          libxcb-shape0-dev \
          libxcb-xfixes0-dev \
          libxkbcommon-dev \
          pkg-config

    # The pinned nightly in rust-toolchain.toml is installed automatically by
    # rustup; we only need to add the clippy component to it.
    - name: Add clippy component
      run: rustup component add clippy

    - name: Cache cargo build
      uses: Swatinem/rust-cache@v2

    - name: Run clippy
      # Lint the crate's own code (lib + bins). `-D warnings` makes any clippy
      # lint a hard CI failure so regressions can't land. If the first run is
      # noisy, fix the findings or scope specific lints down via
      # `#![allow(clippy::...)]` rather than dropping the gate.
      run: cargo clippy --locked --lib --bins -- -D warnings
