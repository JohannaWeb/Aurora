
[package]
name = "aurora-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "An experimental, capability-gated web browser engine in Rust (HTML/CSS/layout + headless rendering)."
license = "MPL-2.0"
repository = "https://github.com/JohannaWeb/Aurora"
readme = "README.md"
keywords = ["browser", "engine", "html", "css", "rendering"]
categories = ["web-programming", "gui", "rendering"]
exclude = [
    "logs/*",
    "docs/*",
    "scratch/*",
    "tests/*",
    "test_suite_analysis/*",
    "managed_context/*",
    "fixtures/*",
    "Cargo.toml.bak",
    "Dockerfile",
    "Dockerfile.dockerignore",
    "Makefile",
]

# Published as `aurora-engine` (the name `aurora` is taken on crates.io), but the
# library and binary keep the `aurora` name so consumers write `use aurora::...`.

# docs.rs has no network, but the `v8` crate downloads prebuilt binaries at build
# time. The public API compiles without any JS engine, so build docs engine-free.
[package.metadata.docs.rs]
no-default-features = true

[lib]
name = "aurora"
path = "src/lib.rs"

[[bin]]
name = "aurora"
path = "src/main.rs"

# V8 is the only supported JavaScript backend. The feature remains so docs.rs and
# other metadata-only builds can use `--no-default-features` without downloading
# the prebuilt V8 archive.
[features]
default = ["v8"]
media-ffmpeg = ["dep:ffmpeg-next"]
taffy-document = []
v8 = ["dep:v8"]

[dependencies]
rustls = { version = "0.23", features = ["ring"] } # still needed for install_crypto_provider()
wgpu = "30.0.0"
vello = "0.11.0"
pollster = "0.4.0"
log = "0.4"
fern = "0.7"
chrono = "0.4"
ab_glyph = "0.2"
rustybuzz = "0.20.1"
peniko = "0.6"
#lowered dep because of blitz-dom transitive
image = "0.25.6"
ffmpeg-next = { version = "8.1.0", optional = true }
html5ever = "0.40.1"
markup5ever = "0.40.0"
cssparser = "0.37.0"
selectors = "0.38.0"
precomputed-hash = "0.1"
taffy = "0.10.1"
# parley pinned: 0.9 currently conflicts with the active vello/peniko/text stack.
# Revisit once Linebender crate versions align.
parley = "0.7"
reqwest = { version = "0.12", features = ["blocking", "rustls-tls", "gzip", "deflate", "brotli"], default-features = false }
usvg = "0.47.0"
winit = "0.30.13"
url = "2.5.8"
blitz-dom = { version = "0.3.0-beta.4", features = ["custom-widget", "tracing", "svg", "woff", "accessibility", "system-fonts", "autofocus", "floats", "file-input", "parallel-construct", "log-phase-times"] }
# Pinned to the exact version blitz-dom uses so we share the same compiled crate
# (and therefore the same thread-local style state). Used to repair Stylo's
# leaked LAYOUT thread-state flag after a caught panic in resolve (see
# `catch_stylo_panic` in src/blitz_document.rs). The crate itself is sourced from
# our local fork via `[patch.crates-io]` below.
style = { version = "=0.22.0", package = "stylo" }
blitz-html = "0.3.0-beta.4"
blitz-paint = "0.3.0-beta.4"
blitz-traits = "=0.3.0-beta.4"
anyrender_vello = "0.15.0"
anyrender = "0.14.0"
v8 = { version = "150.0.0", optional = true }
dioxus = { version = "0.7.9", default-features = false, features = ["macro", "signals", "hooks", "html"] }
dioxus-ssr = "0.7.9"
# vello_svg removed: v0.9.0 links against vello 0.7 + usvg 0.46, incompatible with our vello 0.9 + usvg 0.47

# Local fork of Stylo (== the version blitz-dom uses). This patch redirects every
# stylo consumer in the tree -- our `style` dep AND blitz-dom's transitive one --
# to third_party/stylo. The only change vs. crates.io (see third_party/stylo/UPSTREAM)
# is `ElementStyles::is_display_none` no longer unwrapping a missing primary style
# (upstream stylo#387, still present in 0.22.0), which otherwise aborts the whole
# style resolve on content-bearing YouTube routes. See third_party/stylo/data.rs.
# To move the forks to a new upstream release, see scripts/update_forks.py.
[patch.crates-io]
stylo = { path = "third_party/stylo" }
blitz-dom = { path = "third_party/blitz-dom" }
blitz-paint = { path = "third_party/blitz-paint" }
